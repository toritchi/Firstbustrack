services:
  postgres-test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bus_platform_test
      POSTGRES_USER: busapp
      POSTGRES_PASSWORD: busapp
    ports: ["55432:5432"]
    volumes: [pgtestdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busapp -d bus_platform_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis-test:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  emqx-test:
    image: emqx:5
    ports: ["51883:1883"]
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgtestdata:
